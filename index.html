<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jefferson Roof Panel Production Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    #root { padding: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useMemo, useRef, useEffect } = React;

    const COLS = 49;
    const ROWS = 4;
    const TOTAL_PANELS = COLS * ROWS; // 196

    const STORAGE_KEY_STAGES = 'jefferson_roof_stages';
    const STORAGE_KEY_IMAGE = 'jefferson_roof_image';

    const STAGES = [null, 'Started', 'Printed', 'Laminated', 'Done'];
    const STAGE_OVERLAY = {
      [null]: 'rgba(0, 0, 0, 0)',
      Started: 'rgba(240, 208, 0, 0.55)',
      Printed: 'rgba(232, 138, 42, 0.6)',
      Laminated: 'rgba(126, 200, 227, 0.55)',
      Done: 'rgba(76, 175, 80, 0.6)',
    };
    const STAGE_COLORS = {
      [null]: '#d0d0d0',
      Started: '#f0d000',
      Printed: '#e88a2a',
      Laminated: '#7ec8e3',
      Done: '#4caf50',
    };
    const STAGE_TEXT_COLORS = {
      [null]: '#444',
      Started: '#444',
      Printed: '#fff',
      Laminated: '#1a1a2e',
      Done: '#fff',
    };

    // Panel numbering: left-to-right, bottom row first.
    //   Row 1 (bottom): panels 1-49
    //   Row 2: panels 50-98
    //   Row 3: panels 99-147
    //   Row 4 (top): panels 148-196
    function panelNumber(rowFromBottom, col) {
      return rowFromBottom * COLS + col + 1;
    }

    // --- localStorage helpers ---
    function loadStages() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_STAGES);
        if (raw) {
          const parsed = JSON.parse(raw);
          // Rebuild full object ensuring all 196 keys exist
          const result = {};
          for (let i = 1; i <= TOTAL_PANELS; i++) {
            result[i] = parsed[i] || null;
          }
          return result;
        }
      } catch (e) { /* ignore */ }
      const init = {};
      for (let i = 1; i <= TOTAL_PANELS; i++) init[i] = null;
      return init;
    }

    function saveStages(stages) {
      try {
        // Only save non-null stages to reduce storage size
        const sparse = {};
        for (const [k, v] of Object.entries(stages)) {
          if (v !== null) sparse[k] = v;
        }
        localStorage.setItem(STORAGE_KEY_STAGES, JSON.stringify(sparse));
      } catch (e) { /* ignore */ }
    }

    function loadImage() {
      try {
        return localStorage.getItem(STORAGE_KEY_IMAGE);
      } catch (e) { return null; }
    }

    function saveImage(dataUrl) {
      try {
        localStorage.setItem(STORAGE_KEY_IMAGE, dataUrl);
      } catch (e) {
        console.warn('Image too large for localStorage, will need to reload on refresh.');
      }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function App() {
      const [imageUrl, setImageUrl] = useState(() => loadImage());
      const fileInputRef = useRef(null);

      const [stages, setStages] = useState(loadStages);

      // Persist stages whenever they change
      useEffect(() => {
        saveStages(stages);
      }, [stages]);

      const counts = useMemo(() => {
        const c = { [null]: 0, Started: 0, Printed: 0, Laminated: 0, Done: 0 };
        Object.values(stages).forEach(s => c[s]++);
        return c;
      }, [stages]);

      const handleClick = useCallback((panelNum) => {
        setStages(prev => {
          const curIdx = STAGES.indexOf(prev[panelNum]);
          const nextIdx = (curIdx + 1) % STAGES.length;
          return { ...prev, [panelNum]: STAGES[nextIdx] };
        });
      }, []);

      const handleReset = useCallback(() => {
        if (!window.confirm('Reset all panels to None?')) return;
        setStages(() => {
          const reset = {};
          for (let i = 1; i <= TOTAL_PANELS; i++) reset[i] = null;
          return reset;
        });
      }, []);

      const handleFile = useCallback(async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await fileToDataUrl(file);
        setImageUrl(dataUrl);
        saveImage(dataUrl);
      }, []);

      // Display: top row (row 4) at top of screen, bottom row (row 1) at bottom
      const displayRows = [3, 2, 1, 0];

      return (
        <div>
          <h1 style={{ textAlign: 'center', fontSize: '1.2rem', marginBottom: 8, color: '#fff' }}>
            Jefferson Health Training Complex — Roof Panel Tracker
          </h1>

          {/* Image loader - only show if no image loaded */}
          {!imageUrl && (
            <div style={{
              textAlign: 'center', marginBottom: 12, padding: 16,
              border: '2px dashed #555', borderRadius: 8, background: '#222'
            }}>
              <p style={{ marginBottom: 8, fontSize: '0.9rem' }}>
                Load the roof graphic image to use as panel backgrounds
              </p>
              <button
                onClick={() => fileInputRef.current.click()}
                style={{
                  background: '#3498db', color: '#fff', border: 'none',
                  padding: '8px 20px', borderRadius: 4, cursor: 'pointer',
                  fontSize: '0.9rem', fontWeight: 600,
                }}
              >
                Choose Image File
              </button>
            </div>
          )}

          {/* Summary Bar */}
          <div style={{
            display: 'flex', justifyContent: 'center', gap: 12, flexWrap: 'wrap',
            marginBottom: 10, alignItems: 'center'
          }}>
            {STAGES.map(stage => (
              <div key={stage || 'none'} style={{
                background: STAGE_COLORS[stage],
                color: STAGE_TEXT_COLORS[stage],
                padding: '4px 10px',
                borderRadius: 4,
                fontSize: '0.8rem',
                fontWeight: 600,
              }}>
                {stage || 'None'}: {counts[stage]} / {TOTAL_PANELS}
              </div>
            ))}
            <button onClick={handleReset} style={{
              background: '#c0392b', color: '#fff', border: 'none',
              padding: '4px 12px', borderRadius: 4, cursor: 'pointer',
              fontSize: '0.8rem', fontWeight: 600,
            }}>
              Reset All
            </button>
            {imageUrl && (
              <button
                onClick={() => fileInputRef.current.click()}
                style={{
                  background: '#555', color: '#fff', border: 'none',
                  padding: '4px 12px', borderRadius: 4, cursor: 'pointer',
                  fontSize: '0.8rem', fontWeight: 600,
                }}
              >
                Change Image
              </button>
            )}
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              onChange={handleFile}
              style={{ display: 'none' }}
            />
          </div>

          {/* Grid */}
          <div style={{ overflowX: 'auto' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1, minWidth: 'fit-content' }}>
              {displayRows.map(rowFromBottom => {
                const rowLabel = `Row ${rowFromBottom + 1}`;
                const rowFromTop = ROWS - 1 - rowFromBottom;
                const bgY = ROWS > 1 ? (rowFromTop / (ROWS - 1)) * 100 : 0;

                return (
                  <div key={rowFromBottom} style={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                    <div style={{
                      width: 44, minWidth: 44, textAlign: 'right', paddingRight: 4,
                      fontSize: '0.65rem', color: '#aaa', fontWeight: 600,
                    }}>
                      {rowLabel}
                    </div>
                    {Array.from({ length: COLS }, (_, colIdx) => {
                      const pNum = panelNumber(rowFromBottom, colIdx);
                      const stage = stages[pNum];
                      const bgX = COLS > 1 ? (colIdx / (COLS - 1)) * 100 : 0;

                      return (
                        <div
                          key={pNum}
                          onClick={() => handleClick(pNum)}
                          title={`Panel ${pNum} — ${stage || 'None'} (Row ${rowFromBottom + 1}, Col ${colIdx + 1})`}
                          style={{
                            width: 'calc((100vw - 80px) / 49)',
                            maxWidth: 28,
                            minWidth: 16,
                            aspectRatio: '1 / 1.6',
                            borderRadius: 1,
                            cursor: 'pointer',
                            userSelect: 'none',
                            position: 'relative',
                            overflow: 'hidden',
                            border: '1px solid rgba(255,255,255,0.12)',
                            backgroundImage: imageUrl ? `url(${imageUrl})` : 'none',
                            backgroundColor: imageUrl ? 'transparent' : '#888',
                            backgroundSize: `${COLS * 100}% ${ROWS * 100}%`,
                            backgroundPosition: `${bgX}% ${bgY}%`,
                            backgroundRepeat: 'no-repeat',
                          }}
                        >
                          {/* Grayscale + dim overlay to mute the image */}
                          <div style={{
                            position: 'absolute',
                            inset: 0,
                            backdropFilter: 'grayscale(100%)',
                            WebkitBackdropFilter: 'grayscale(100%)',
                            background: 'rgba(0, 0, 0, 0.35)',
                          }} />
                          {/* Stage color overlay */}
                          <div style={{
                            position: 'absolute',
                            inset: 0,
                            background: STAGE_OVERLAY[stage],
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            fontSize: '0.5rem',
                            fontWeight: 700,
                            color: '#fff',
                            textShadow: '0 0 3px rgba(0,0,0,0.9)',
                            transition: 'background 0.15s',
                          }}>
                            {pNum}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Column numbers along bottom */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 1, marginTop: 2 }}>
            <div style={{ width: 44, minWidth: 44 }} />
            {Array.from({ length: COLS }, (_, i) => (
              <div key={i} style={{
                width: 'calc((100vw - 80px) / 49)',
                maxWidth: 28,
                minWidth: 16,
                textAlign: 'center',
                fontSize: '0.5rem',
                color: '#666',
              }}>
                {i + 1}
              </div>
            ))}
          </div>

          {/* Legend */}
          <div style={{
            marginTop: 12, textAlign: 'center', fontSize: '0.7rem', color: '#888'
          }}>
            Click a panel to cycle: None → Started → Printed → Laminated → Done → None
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
