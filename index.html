<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jefferson Roof Panel Production Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    #root { padding: 12px; }
    .conn-status {
      position: fixed; top: 8px; right: 12px; padding: 4px 10px;
      border-radius: 4px; font-size: 0.7rem; font-weight: 600; z-index: 100;
    }
    .conn-status.connected { background: #4caf50; color: #fff; }
    .conn-status.disconnected { background: #c0392b; color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useMemo, useRef, useEffect } = React;

    const COLS = 49;
    const ROWS = 4;
    const TOTAL_PANELS = COLS * ROWS; // 196

    const STAGES = [null, 'Started', 'Printed', 'Laminated', 'Done'];
    const STAGE_OVERLAY = {
      [null]: 'rgba(0, 0, 0, 0)',
      Started: 'rgba(240, 208, 0, 0.55)',
      Printed: 'rgba(232, 138, 42, 0.6)',
      Laminated: 'rgba(126, 200, 227, 0.55)',
      Done: 'rgba(76, 175, 80, 0.6)',
    };
    const STAGE_COLORS = {
      [null]: '#d0d0d0',
      Started: '#f0d000',
      Printed: '#e88a2a',
      Laminated: '#7ec8e3',
      Done: '#4caf50',
    };
    const STAGE_TEXT_COLORS = {
      [null]: '#444',
      Started: '#444',
      Printed: '#fff',
      Laminated: '#1a1a2e',
      Done: '#fff',
    };

    const DEFAULT_IMAGE = 'RoofGraphic_3dpi.png';

    function panelNumber(rowFromBottom, col) {
      return rowFromBottom * COLS + col + 1;
    }

    function initStages() {
      const init = {};
      for (let i = 1; i <= TOTAL_PANELS; i++) init[i] = null;
      return init;
    }

    function buildStagesFromSparse(sparse) {
      const result = initStages();
      if (sparse) {
        for (const [k, v] of Object.entries(sparse)) {
          result[k] = v;
        }
      }
      return result;
    }

    // --- WebSocket connection ---
    function useWebSocket() {
      const wsRef = useRef(null);
      const listenersRef = useRef(new Set());
      const [connected, setConnected] = useState(false);

      const addListener = useCallback((fn) => {
        listenersRef.current.add(fn);
        return () => listenersRef.current.delete(fn);
      }, []);

      const send = useCallback((data) => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(data));
        }
      }, []);

      useEffect(() => {
        let reconnectTimer;
        function connect() {
          const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(`${protocol}//${location.host}`);
          wsRef.current = ws;

          ws.onopen = () => setConnected(true);
          ws.onclose = () => {
            setConnected(false);
            reconnectTimer = setTimeout(connect, 2000);
          };
          ws.onerror = () => ws.close();
          ws.onmessage = (e) => {
            try {
              const msg = JSON.parse(e.data);
              listenersRef.current.forEach(fn => fn(msg));
            } catch (err) { /* ignore */ }
          };
        }
        connect();
        return () => {
          clearTimeout(reconnectTimer);
          if (wsRef.current) wsRef.current.close();
        };
      }, []);

      return { connected, send, addListener };
    }

    // --- PanelGrid component (one set) ---
    function PanelGrid({ setId, send, addListener }) {
      const [stages, setStages] = useState(initStages);

      // Listen for server messages
      useEffect(() => {
        return addListener((msg) => {
          if (msg.type === 'init') {
            const sparse = msg.state[`set${setId}`];
            setStages(buildStagesFromSparse(sparse));
          } else if (msg.type === 'update' && msg.setId === setId) {
            setStages(prev => ({ ...prev, [msg.panelNum]: msg.stage }));
          } else if (msg.type === 'reset' && msg.setId === setId) {
            setStages(initStages());
          }
        });
      }, [setId, addListener]);

      const counts = useMemo(() => {
        const c = { [null]: 0, Started: 0, Printed: 0, Laminated: 0, Done: 0 };
        Object.values(stages).forEach(s => c[s]++);
        return c;
      }, [stages]);

      const handleClick = useCallback((panelNum) => {
        setStages(prev => {
          const curIdx = STAGES.indexOf(prev[panelNum]);
          const nextIdx = (curIdx + 1) % STAGES.length;
          const nextStage = STAGES[nextIdx];
          send({ type: 'update', setId, panelNum, stage: nextStage });
          return { ...prev, [panelNum]: nextStage };
        });
      }, [setId, send]);

      const handleReset = useCallback(() => {
        if (!window.confirm(`Reset all panels in Set ${setId} to None?`)) return;
        send({ type: 'reset', setId });
        setStages(initStages());
      }, [setId, send]);

      const displayRows = [3, 2, 1, 0];

      return (
        <div style={{ marginBottom: 32 }}>
          <h2 style={{ textAlign: 'center', fontSize: '1.1rem', marginBottom: 8, color: '#fff' }}>
            Set {setId}
          </h2>

          {/* Summary Bar */}
          <div style={{
            display: 'flex', justifyContent: 'center', gap: 12, flexWrap: 'wrap',
            marginBottom: 10, alignItems: 'center'
          }}>
            {STAGES.map(stage => (
              <div key={stage || 'none'} style={{
                background: STAGE_COLORS[stage],
                color: STAGE_TEXT_COLORS[stage],
                padding: '4px 10px',
                borderRadius: 4,
                fontSize: '0.8rem',
                fontWeight: 600,
              }}>
                {stage || 'None'}: {counts[stage]} / {TOTAL_PANELS}
              </div>
            ))}
            <button onClick={handleReset} style={{
              background: '#c0392b', color: '#fff', border: 'none',
              padding: '4px 12px', borderRadius: 4, cursor: 'pointer',
              fontSize: '0.8rem', fontWeight: 600,
            }}>
              Reset All
            </button>
          </div>

          {/* Grid */}
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1, width: '100%' }}>
              {displayRows.map(rowFromBottom => {
                const rowLabel = `Row ${rowFromBottom + 1}`;
                const rowFromTop = ROWS - 1 - rowFromBottom;
                const bgY = ROWS > 1 ? (rowFromTop / (ROWS - 1)) * 100 : 0;

                return (
                  <div key={rowFromBottom} style={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                    <div style={{
                      width: 44, minWidth: 44, textAlign: 'right', paddingRight: 4,
                      fontSize: '0.65rem', color: '#aaa', fontWeight: 600,
                    }}>
                      {rowLabel}
                    </div>
                    {Array.from({ length: COLS }, (_, colIdx) => {
                      const pNum = panelNumber(rowFromBottom, colIdx);
                      const stage = stages[pNum];
                      const bgX = COLS > 1 ? (colIdx / (COLS - 1)) * 100 : 0;

                      return (
                        <div
                          key={pNum}
                          onClick={() => handleClick(pNum)}
                          title={`Panel ${pNum} — ${stage || 'None'} (Row ${rowFromBottom + 1}, Col ${colIdx + 1})`}
                          style={{
                            flex: 1,
                            aspectRatio: '1 / 1.6',
                            borderRadius: 1,
                            cursor: 'pointer',
                            userSelect: 'none',
                            position: 'relative',
                            overflow: 'hidden',
                            border: '1px solid rgba(255,255,255,0.12)',
                            backgroundImage: `url(${DEFAULT_IMAGE})`,
                            backgroundSize: `${COLS * 100}% ${ROWS * 100}%`,
                            backgroundPosition: `${bgX}% ${bgY}%`,
                            backgroundRepeat: 'no-repeat',
                          }}
                        >
                          {/* Grayscale + dim overlay */}
                          <div style={{
                            position: 'absolute',
                            inset: 0,
                            backdropFilter: 'grayscale(100%)',
                            WebkitBackdropFilter: 'grayscale(100%)',
                            background: 'rgba(0, 0, 0, 0.35)',
                          }} />
                          {/* Stage color overlay */}
                          <div style={{
                            position: 'absolute',
                            inset: 0,
                            background: STAGE_OVERLAY[stage],
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            fontSize: '0.5rem',
                            fontWeight: 700,
                            color: '#fff',
                            textShadow: '0 0 3px rgba(0,0,0,0.9)',
                            transition: 'background 0.15s',
                          }}>
                            {pNum}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Column numbers */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 1, marginTop: 2 }}>
            <div style={{ width: 44, minWidth: 44 }} />
            {Array.from({ length: COLS }, (_, i) => (
              <div key={i} style={{
                flex: 1,
                textAlign: 'center',
                fontSize: '0.5rem',
                color: '#666',
              }}>
                {i + 1}
              </div>
            ))}
          </div>

          {/* Legend */}
          <div style={{
            marginTop: 8, textAlign: 'center', fontSize: '0.7rem', color: '#888'
          }}>
            Click a panel to cycle: None → Started → Printed → Laminated → Done → None
          </div>
        </div>
      );
    }

    function App() {
      const { connected, send, addListener } = useWebSocket();

      return (
        <div style={{ maxWidth: '100%', margin: '0 auto' }}>
          <div className={`conn-status ${connected ? 'connected' : 'disconnected'}`}>
            {connected ? 'Live' : 'Reconnecting...'}
          </div>
          <h1 style={{ textAlign: 'center', fontSize: '1.3rem', marginBottom: 16, color: '#fff' }}>
            Jefferson Health Training Complex — Roof Panel Tracker
          </h1>
          <PanelGrid setId={1} send={send} addListener={addListener} />
          <PanelGrid setId={2} send={send} addListener={addListener} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
